# MCP integration test: start SPADE, configure the analyzer, run the MCP server
# over HTTP, and exercise it with the mock LLM CLI client.

name: MCP Integration Test

on:
  push:
    branches: [ "mcp-dev" ]
  pull_request:
    branches: [ "mcp-dev" ]

jobs:
  mcp-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}

    env:
      JVM_MEM_MIN: 512m
      JVM_MEM_MAX: 4g

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          auditd autoconf automake bison clang cmake curl flex fuse \
          git ifupdown libaudit-dev libfuse-dev \
          lsof maven pkg-config unzip uthash-dev wget

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install autoconf automake git maven pkg-config

    - name: Configure
      run: ./configure

    # TEMPORARY WORKAROUND: these are normally run as part of `make install` /
    # first-run setup, but must be run manually here before `make` until that
    # is fixed. Remove this step once building no longer requires it.
    - name: Generate keys and install Neo4j (temporary workaround)
      run: |
        bin/keys/generatekeys.sh
        bin/manage-neo4j.sh install

    - name: Build (Linux)
      if: runner.os == 'Linux'
      run: make KERNEL_MODULES=true

    - name: Build (macOS)
      if: runner.os == 'macOS'
      run: make

    - name: Start SPADE
      run: bin/spade start

    - name: Wait for SPADE control to connect successfully
      run: |
        for i in $(seq 1 30); do
          printf 'exit\n' | bin/spade control && echo "SPADE control port ready" && break
          echo "Waiting for SPADE... ($i/30)"
          sleep 2
        done
        printf 'exit\n' | bin/spade control || (echo "SPADE control port never became ready" && exit 1)

    - name: Configure SPADE (add analyzer)
      run: |
        printf 'add analyzer CommandLine\nexit\n' \
          | bin/spade control

    - name: Start MCP server
      run: |
        bin/spade mcp > mcp-server.log 2>&1 &
        echo $! > mcp-server.pid
        echo "MCP server started (PID $(cat mcp-server.pid))"

    - name: Wait for MCP server
      run: |
        MCP_HTTP_PORT=$(grep -E '^\s*mcp\.http\.host\.port\s*=' cfg/spade.utility.mcp.server.Main.config | tail -1 | cut -d '=' -f2 | tr -d ' ')
        for i in $(seq 1 30); do
          nc -z localhost "${MCP_HTTP_PORT}" && echo "MCP server ready" && break
          echo "Waiting for MCP server... ($i/30)"
          sleep 2
        done
        nc -z localhost "${MCP_HTTP_PORT}" || (echo "MCP server never became ready" && cat mcp-server.log && exit 1)

    - name: Run MCP client test
      run: |
        echo 'test message' | ./bin/spade run-util -- spade.utility.mcp.client.Main \
          llm.type=mock \
          user.mode=cli \
          verbose=true \
          llm.mock.scenario=add_and_remove_neo4j_storage

    - name: MCP client test output header
      run: |
        echo '======== MCP CLIENT TEST ========'
        echo 'Output shows the mock LLM replaying the add_and_remove_neo4j_storage scenario against the MCP server, verifying the actual result of each tool call.'
        echo '================================='

    - name: Show MCP server log on failure
      if: failure()
      run: cat mcp-server.log 2>/dev/null || true
